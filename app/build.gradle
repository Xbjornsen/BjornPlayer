plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing comes from environment variables (CI / GitHub secrets) or a
// local, gitignored keystore.properties for local release builds. Env wins.
def localKeystoreProps = new Properties()
def localKeystoreFile = rootProject.file("keystore.properties")
if (localKeystoreFile.exists()) {
    localKeystoreFile.withInputStream { localKeystoreProps.load(it) }
}
def signingStoreFile = System.getenv("KEYSTORE_FILE") ?: localKeystoreProps.getProperty("storeFile")
def signingStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: localKeystoreProps.getProperty("storePassword")
def signingKeyAlias = System.getenv("KEY_ALIAS") ?: localKeystoreProps.getProperty("keyAlias")
def signingKeyPassword = System.getenv("KEY_PASSWORD") ?: localKeystoreProps.getProperty("keyPassword")
def hasReleaseSigning = signingStoreFile != null

android {
    namespace 'com.bjorntech.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.bjorntech.player"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign when a keystore is configured; otherwise build unsigned
            // (used for CI compile checks on pushes/PRs without secrets).
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // exposes BuildConfig.VERSION_NAME to the in-app updater
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'   // lifecycleScope for the update check

    // Media3 ExoPlayer (Google's modern media library)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // Glide for album art
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Palette for album art colour extraction
    implementation 'androidx.palette:palette-ktx:1.0.0'
}
